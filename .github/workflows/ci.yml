name: CI Pipeline

on:
  push:
    branches: [main, master, staging, develop]
  pull_request:
    branches: [main, master, staging, develop]

jobs:
  backend-test:
    name: Backend Test Suite & Migrations
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    env:
      DJANGO_SECRET_KEY: ci-test-secret-key-32-chars-long-minimum!
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1"
      MPESA_ENVIRONMENT: sandbox

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Django Configuration Check
        run: python manage.py check

      - name: Check Database Migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run Backend Test Suite
        run: python manage.py test apps

  frontend-build:
    name: Frontend Quality & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
      NEXT_PUBLIC_BACKEND_ORIGIN: http://localhost:8000
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      - name: Run ESLint
        run: npm run lint
        continue-on-error: true

      - name: Run TypeScript Type Check
        run: npx tsc --noEmit
        continue-on-error: true

      - name: Run Frontend Unit Tests
        run: npm test

      - name: Run Next.js Build
        run: npm run build
